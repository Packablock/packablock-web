version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rails-framework:
        patterns:
          - "rails*"
          - "active*"
          - "action*"
      solid-adapters:
        patterns:
          - "solid_*"
      development-dependencies:
        patterns:
          - "rubocop*"
          - "brakeman"
          - "bundler-audit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-updates:
        patterns:
          - "actions/*"
