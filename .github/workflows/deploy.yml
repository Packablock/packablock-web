name: Deploy Production to GCP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write' # Required for Workload Identity Federation OIDC token request

env:
  PROJECT_ID: 'adwb-4444'
  REGION: 'us-west1'
  GAR_REPO: 'us-west1-docker.pkg.dev/adwb-4444/packablock-images'
  SERVICE_NAME: 'packablock-web'
  DB_INSTANCE_CONNECTION: 'adwb-4444:us-west1:packablock-shared-db'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud using WIF OIDC
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/450487093520/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gh-deployer@adwb-4444.iam.gserviceaccount.com'

      # 2. Authenticate Docker with Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      # 3. Set up Docker Buildx (caching helper)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build & Tag Container Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --add-cloudsql-instances=${{ env.DB_INSTANCE_CONNECTION }}
            --allow-unauthenticated
          env_vars: |
            RAILS_ENV=production
            DB_USER=postgres
            DB_SOCKET_DIR=/cloudsql/${{ env.DB_INSTANCE_CONNECTION }}
            DB_NAME=packablock_web_prod
            RAILS_LOG_TO_STDOUT=true
          secrets: |
            RAILS_MASTER_KEY=RAILS_MASTER_KEY:latest
            DB_PASSWORD=DB_PASSWORD:latest
