name: Deploy Production to GCP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write' # Required for Workload Identity Federation OIDC token request

env:
  PROJECT_ID: 'adwb-4444'
  REGION: 'us-west1'
  GAR_REPO: 'us-west1-docker.pkg.dev/adwb-4444/packablock-images'
  SERVICE_NAME: 'packablock-web'
  DB_INSTANCE_CONNECTION: 'adwb-4444:us-west1:packablock-shared-db'
  REGISTRY_API_URL: 'https://packablock-registry-450487093520.us-west1.run.app'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      # 1. Validate API Compatibility Gate
      - name: Validate API Compatibility Gate
        run: |
          REQUIRED_VERSION="1.2.0"
          
          # Fetch running version from the production API
          RUNNING_JSON=$(curl -s --fail ${{ env.REGISTRY_API_URL }}/version)
          RUNNING_VERSION=$(echo $RUNNING_JSON | jq -r '.version')
          
          echo "Current running registry version: $RUNNING_VERSION"
          echo "Minimum required version for this console release: $REQUIRED_VERSION"
          
          if [ "$RUNNING_VERSION" = "null" ] || [ -z "$RUNNING_VERSION" ]; then
            echo "❌ ERROR: Could not retrieve version from production registry API."
            exit 1
          fi
          
          # SemVer comparison check
          if [ "$(printf '%s\n%s' "$REQUIRED_VERSION" "$RUNNING_VERSION" | sort -V | head -n1)" != "$REQUIRED_VERSION" ]; then
            echo "❌ ERROR: The production registry API is running version $RUNNING_VERSION, which is incompatible with this console release (requires >= $REQUIRED_VERSION)."
            echo "Please deploy the packablock-registry update first."
            exit 1
          fi
          echo "✅ Pre-flight compatibility checks passed!"

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/450487093520/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gh-deployer@adwb-4444.iam.gserviceaccount.com'

      # 3. Authenticate Docker with Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      # 4. Set up Docker Buildx (caching helper)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5. Build & Tag Container Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --add-cloudsql-instances=${{ env.DB_INSTANCE_CONNECTION }}
            --allow-unauthenticated
            --execution-environment=gen2
            --startup-probe=httpGet.path=/up,httpGet.port=8080,initialDelaySeconds=10,periodSeconds=5,failureThreshold=12,timeoutSeconds=5
          env_vars: |
            RAILS_ENV=production
            HTTP_PORT=8080
            TARGET_PORT=3000
            PUMA_PORT=3000
            DB_USER=postgres
            DB_SOCKET_DIR=/cloudsql/${{ env.DB_INSTANCE_CONNECTION }}
            DB_NAME=packablock_web_prod
            RAILS_LOG_TO_STDOUT=true
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REGISTRY_API_URL=${{ env.REGISTRY_API_URL }}
            INTERNAL_REGISTRY_TOKEN=internal_secret_token_1234
