# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: db/registry_web.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: db/registry_web_test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  adapter: postgresql
  encoding: unicode
  database: <%= ENV['DB_NAME'] || 'packablock_web_prod' %>
  username: <%= ENV['DB_USER'] || 'postgres' %>
  password: <%= ENV['DB_PASSWORD'] %>
  # Connecting via Unix socket folder for Cloud Run proxy linkage
  host: <%= ENV['DB_SOCKET_DIR'] || '/cloudsql/adwb-4444:us-west1:packablock-shared-db' %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
